<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Propinas | 100 Días de Código</title>
    <meta name="description" content="Calculadora de propinas para dividir una cuenta entre varias personas.">
    <link rel="icon" href="../../assets/favicon.png">
    <link rel="stylesheet" href="../project.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="calculator">
        <a href="../../index.html" class="back-link">← Volver a proyectos</a>

        <section class="project-card">
            <h1>Calculadora de Propinas</h1>

            <form id="tip-form">
                <div class="form-group">
                    <label for="bill">Total de la cuenta</label>

                    <div class="input-wrapper">
                        <span>$</span>
                        <input type="number" id="bill" placeholder="0.00" min="0" step="0.01" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="tip">Porcentaje de propina</label>

                    <select id="tip" required>
                        <option value="10">10%</option>
                        <option value="12">12%</option>
                        <option value="15">15%</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="people">Número de personas</label>
                    <input type="number" id="people" placeholder="1" min="1" step="1" required>
                </div>

                <button type="submit">Calcular</button>
            </form>

            <div id="result" class="result hidden">
                <span>Cada persona debe pagar:</span>
                <strong id="amount-per-person">$0.00</strong>
            </div>
        </section>
    </main>

    <script src="script.js"></script>

</body>
</html>
