<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Nombres | 100 Días de Código</title>
    <meta name="description" content="Generador de nombres de bandas">
    <link rel="stylesheet" href="/projects/generador-nombres/style.css">
</head>

<body>
    <main class="generator">

        <a href="../../index.html" class="back-link">
            ← Volver a proyectos
        </a>

        <section class="generator-card">
            <h1>Generador de Nombres</h1>

            <form id="band-form">
                <div class="form-group">
                    <label for="city">Ciudad donde creciste</label>
                    <input type="text" id="city" placeholder="Ej. Cuernavaca" autocomplete="off" required>
                </div>

                <div class="form-group">
                    <label for="pet">Nombre de tu mascota</label>
                    <input type="text" id="pet" placeholder="Ej. Max" autocomplete="off" required>
                </div>

                <button type="submit">Generar nombre</button>
            </form>

            <div id="result" class="result hidden">
                <span>Tu nombre de banda podría ser:</span>
                <strong id="band-name"></strong>
            </div>
        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
